<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Personal reels-style video player">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reels">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Reels</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- Picker screen ---------- */
  #picker-screen {
    height: 100vh; width: 100vw;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #picker-box { text-align: center; color: #fff; padding: 40px 32px; }
  #picker-icon {
    width: 64px; height: 64px; margin: 0 auto 24px;
    border-radius: 50%; background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcaf45);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff;
  }
  #picker-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.4px; }
  #picker-sub { font-size: 15px; color: rgba(255,255,255,0.6); margin-bottom: 32px; line-height: 1.4; }
  .picker-btn {
    display: block; width: 280px; margin: 0 auto 10px;
    padding: 11px 0; border-radius: 8px;
    background: linear-gradient(135deg, #833ab4, #fd1d1d);
    color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; border: none; transition: opacity 0.2s;
  }
  .picker-btn:active { opacity: 0.8; }
  .picker-btn.secondary { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.3); }

  /* ---------- Viewer ---------- */
  #viewer {
    position: fixed; inset: 0; display: none;
    background: #000; touch-action: none;
  }
  #main-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  #gesture-layer {
    position: absolute; inset: 0; z-index: 3;
    background: transparent; touch-action: none;
  }

  .top-nav {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 12px 14px; display: flex;
    justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    z-index: 5; color: #fff;
    transition: opacity 0.35s ease;
  }
  .nav-title {
    font-size: 15px; font-weight: 600; letter-spacing: -0.3px;
    flex: 1 1 auto; min-width: 0; margin-right: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-icons { display: flex; gap: 16px; align-items: center; flex: 0 0 auto; }
  .nav-icon {
    font-size: 17px; cursor: pointer; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.12); border-radius: 50%;
  }
  .nav-icon.active { background: linear-gradient(135deg, #833ab4, #fd1d1d); }

  .counter {
    position: absolute; top: 54px; left: 14px; z-index: 5;
    font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 600;
    transition: opacity 0.35s ease;
  }

  .play-icon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 4; opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .play-icon svg { width: 60px; height: 60px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }
  #viewer.paused .play-icon { opacity: 1; }

  .seek-badge {
    position: absolute; top: 54px; right: 14px; z-index: 5;
    font-size: 12px; color: #fff; font-weight: 600;
    background: rgba(0,0,0,0.45); padding: 3px 9px; border-radius: 12px;
    opacity: 0; transition: opacity 0.2s;
  }
  .seek-badge.show { opacity: 1; }
  .zoom-badge {
    position: absolute; top: 54px; right: 14px; z-index: 5;
    font-size: 12px; color: #fff; font-weight: 600;
    background: rgba(0,0,0,0.45); padding: 3px 9px; border-radius: 12px;
    opacity: 0; transition: opacity 0.2s;
  }
  .zoom-badge.show { opacity: 1; }

  .bottom-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 10px 14px 16px; z-index: 5;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    transition: opacity 0.35s ease;
  }

  #viewer.controls-hidden .top-nav,
  #viewer.controls-hidden .bottom-controls,
  #viewer.controls-hidden .counter {
    opacity: 0; pointer-events: none;
  }

  .progress-bar {
    position: relative; height: 30px;
    display: flex; align-items: center;
    cursor: pointer; margin-bottom: 8px;
  }
  .progress-track {
    position: relative; width: 100%; height: 3px;
    background: rgba(255,255,255,0.25); border-radius: 2px;
    transition: height 0.15s;
  }
  .progress-bar.dragging .progress-track { height: 8px; }
  .progress-fill { height: 100%; width: 0%; background: #fff; border-radius: 2px; }
  .progress-thumb {
    position: absolute; top: 50%; left: 0%;
    width: 16px; height: 16px; background: #fff; border-radius: 50%;
    transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.2s;
  }
  .progress-bar.dragging .progress-thumb { opacity: 1; }
  .scrub-preview {
    position: absolute; bottom: 100%; margin-bottom: 10px;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 6;
  }
  .scrub-preview.show { opacity: 1; }
  .scrub-thumb {
    width: 120px; height: 67px; border-radius: 8px; background: #111;
    border: 1.5px solid rgba(255,255,255,0.55);
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    display: block;
  }
  .scrub-time {
    background: rgba(0,0,0,0.8); color: #fff;
    font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 6px; white-space: nowrap;
  }

  .control-row {
    display: flex; align-items: center; justify-content: center; gap: 22px;
  }
  .ctrl-btn {
    background: none; border: none; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.9;
  }
  .ctrl-btn:active { opacity: 0.5; }
  .ctrl-btn.play-pause {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #833ab4, #fd1d1d);
  }
  .ctrl-btn svg { width: 22px; height: 22px; }
  .ctrl-btn.play-pause svg { width: 24px; height: 24px; }
  .ctrl-btn.skip svg { width: 24px; height: 24px; }
  .ctrl-btn.nav { opacity: 0.85; }
  .ctrl-btn[disabled] { opacity: 0.25; pointer-events: none; }

  :fullscreen { background: #000; }
</style>
</head>
<body>

<div id="picker-screen">
  <div id="picker-box">
    <div id="picker-icon">▶</div>
    <div id="picker-title">Reels</div>
    <div id="picker-sub">Load your videos and swipe through them.</div>
    <button class="picker-btn" id="folderBtn">
      Choose folder
      <input type="file" id="folderInput" webkitdirectory multiple accept="video/*" hidden>
    </button>
    <button class="picker-btn secondary" id="filesBtn">
      Choose files
      <input type="file" id="filesInput" multiple accept="video/*" hidden>
    </button>
  </div>
</div>

<div id="viewer">
  <video id="main-video" playsinline loop></video>
  <div id="gesture-layer"></div>

  <div class="top-nav">
    <div class="nav-title" id="videoTitle">Reels</div>
    <div class="nav-icons">
      <div class="nav-icon" id="zoomOutBtn" title="Zoom out">−</div>
      <div class="nav-icon" id="zoomInBtn" title="Zoom in">+</div>
      <div class="nav-icon" id="fsToggle" title="Fullscreen">⛶</div>
      <div class="nav-icon" id="muteToggle" title="Mute">🔇</div>
    </div>
  </div>

  <div class="counter" id="counter"></div>
  <div class="seek-badge" id="seekBadge">10s</div>
  <div class="zoom-badge" id="zoomBadge">100%</div>

  <div class="play-icon">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
  </div>

  <div class="bottom-controls">
    <div class="progress-bar" id="progressBar">
      <div class="scrub-preview" id="scrubPreview">
        <canvas class="scrub-thumb" id="scrubThumb" width="160" height="90"></canvas>
        <div class="scrub-time" id="scrubTime">0:00</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
    </div>
    <div class="control-row">
      <button class="ctrl-btn nav" id="prevBtn" title="Previous">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn skip" id="backBtn" title="-10s">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
      <button class="ctrl-btn play-pause" id="playPauseBtn" title="Play/Pause">
        <svg id="playIconBtn" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn skip" id="fwdBtn" title="+10s">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
      </button>
      <button class="ctrl-btn nav" id="nextBtn" title="Next">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const pickerScreen = document.getElementById('picker-screen');
const viewer = document.getElementById('viewer');
const video = document.getElementById('main-video');
const gestureLayer = document.getElementById('gesture-layer');

document.getElementById('folderBtn').addEventListener('click', () => document.getElementById('folderInput').click());
document.getElementById('filesBtn').addEventListener('click', () => document.getElementById('filesInput').click());

let files = [];
let currentIndex = 0;
let isMuted = true;
video.muted = true;

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function loadVideos(fileList) {
  files = shuffleArray([...fileList].filter(f => f.type.startsWith('video/')));
  if (!files.length) { alert('No video files found.'); return; }
  pickerScreen.style.display = 'none';
  viewer.style.display = 'block';
  initViewer();
  loadIndex(0);
}

document.getElementById('folderInput').addEventListener('change', e => loadVideos(e.target.files));
document.getElementById('filesInput').addEventListener('change', e => loadVideos(e.target.files));

function initViewer() {
  setupGestures();
  setupWheelZoom();
  setupPlaybackUI();
  setupTopNav();
}

let videoScale = 1;
const MIN_SCALE = 1, MAX_SCALE = 3.5;
let pinching = false, pinchStartDist = 0, pinchStartScale = 1;

let panX = 0, panY = 0;
function clampNum(v, min, max) { return Math.max(min, Math.min(max, v)); }

function applyVideoTransform() {
  const maxPanX = (window.innerWidth * (videoScale - 1)) / 2;
  const maxPanY = (window.innerHeight * (videoScale - 1)) / 2;
  panX = clampNum(panX, -maxPanX, maxPanX);
  panY = clampNum(panY, -maxPanY, maxPanY);
  video.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + videoScale + ')';
}

let zoomBadgeTimer;
function showZoomBadge() {
  const badge = document.getElementById('zoomBadge');
  badge.textContent = Math.round(videoScale * 100) + '%';
  badge.classList.add('show');
  clearTimeout(zoomBadgeTimer);
  zoomBadgeTimer = setTimeout(() => badge.classList.remove('show'), 900);
}

function dist(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function setupWheelZoom() {
  gestureLayer.addEventListener('wheel', (e) => {
    e.preventDefault();
    videoScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, videoScale - e.deltaY * 0.002));
    applyVideoTransform();
    showZoomBadge();
  }, { passive: false });

  document.getElementById('zoomOutBtn').addEventListener('click', () => {
    videoScale = Math.max(MIN_SCALE, videoScale - 0.25);
    applyVideoTransform();
    showZoomBadge();
  });
  document.getElementById('zoomInBtn').addEventListener('click', () => {
    videoScale = Math.min(MAX_SCALE, videoScale + 0.25);
    applyVideoTransform();
    showZoomBadge();
  });
}

/* ---------- Controls: single tap shows/hides them (no auto-hide, no toggle button) ---------- */
function toggleControls() {
  viewer.classList.toggle('controls-hidden');
}

/* ---------- Gestures: one pointer tracker for pinch / swipe / seek / taps ---------- */

const activePointers = new Map();

let dragStartX = 0, dragStartY = 0, pointerDownTime = 0, pointerMoved = false;

const SWIPE_DIST = 60;
const SWIPE_MAX_TIME = 550;
const TAP_MAX_TIME = 300;
const DOUBLE_TAP_WINDOW = 280;

let lastTapTime = 0;
let singleTapTimer = null;

let gestureMode = null; // null | 'seek' | 'swipe'
let seekStartTime = 0;
const SEEK_PX_PER_SEC = 8;

let pinchStartMidX = 0, pinchPanStartX = 0;

function showSeekDragBadge(delta) {
  const badge = document.getElementById('seekBadge');
  const secs = Math.round(Math.abs(delta));
  badge.textContent = delta < 0 ? ('« ' + secs + 's') : (secs + 's »');
  badge.classList.add('show');
  clearTimeout(seekBadgeTimer);
}

function startPinch() {
  pinching = true;
  gestureMode = null;
  clearTimeout(singleTapTimer);
  lastTapTime = 0;
  const pts = [...activePointers.values()];
  pinchStartDist = dist(pts[0], pts[1]);
  pinchStartScale = videoScale;
  pinchStartMidX = (pts[0].x + pts[1].x) / 2;
  pinchPanStartX = panX;
}

function updatePinch() {
  const pts = [...activePointers.values()];
  const d = dist(pts[0], pts[1]);
  videoScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchStartScale * (d / pinchStartDist)));
  const midX = (pts[0].x + pts[1].x) / 2;
  panX = pinchPanStartX + (midX - pinchStartMidX);
  applyVideoTransform();
  showZoomBadge();
}

function setupGestures() {
  gestureLayer.addEventListener('pointerdown', (e) => {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activePointers.size === 2) { startPinch(); return; }
    if (activePointers.size > 2) return;

    pointerMoved = false;
    gestureMode = null;
    pointerDownTime = Date.now();
    dragStartX = e.clientX;
    dragStartY = e.clientY;
  });

  gestureLayer.addEventListener('pointermove', (e) => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pinching) {
      if (activePointers.size >= 2) updatePinch();
      return;
    }
    if (activePointers.size !== 1) return;

    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) pointerMoved = true;

    if (!gestureMode && pointerMoved) {
      gestureMode = Math.abs(dx) > Math.abs(dy) ? 'seek' : 'swipe';
      if (gestureMode === 'seek') seekStartTime = video.currentTime;
    }

    if (gestureMode === 'seek' && video.duration) {
      const delta = dx / SEEK_PX_PER_SEC;
      const target = Math.max(0, Math.min(video.duration, seekStartTime + delta));
      video.currentTime = target;
      showSeekDragBadge(target - seekStartTime);
    }
  });

  window.addEventListener('pointerup', onGestureUp);
  window.addEventListener('pointercancel', onGestureUp);
}

function onGestureUp(e) {
  const wasPinching = pinching;
  const wasTracked = activePointers.has(e.pointerId);
  activePointers.delete(e.pointerId);
  if (!wasTracked) return; // pointer didn't start on the gesture layer (e.g. a button or the progress bar)

  if (wasPinching) {
    if (activePointers.size < 2) {
      pinching = false;
      const remaining = [...activePointers.values()][0];
      if (remaining) { dragStartX = remaining.x; dragStartY = remaining.y; }
      pointerDownTime = Date.now();
      pointerMoved = false;
    }
    gestureMode = null;
    return;
  }
  if (activePointers.size > 0) return;

  if (gestureMode === 'seek') {
    gestureMode = null;
    clearTimeout(seekBadgeTimer);
    seekBadgeTimer = setTimeout(() => document.getElementById('seekBadge').classList.remove('show'), 500);
    return;
  }

  const dy = e.clientY - dragStartY;
  const elapsed = Date.now() - pointerDownTime;
  const absDy = Math.abs(dy);

  // fast vertical flick switches videos
  if (gestureMode === 'swipe') {
    gestureMode = null;
    if (absDy > SWIPE_DIST && elapsed < SWIPE_MAX_TIME) {
      if (dy < 0) loadIndex(currentIndex + 1);
      else loadIndex(currentIndex - 1);
    }
    return;
  }

  gestureMode = null;

  // taps: 1 tap = show/hide controls, 2 taps = play/pause
  if (!pointerMoved && elapsed < TAP_MAX_TIME) {
    const now = Date.now();
    if (now - lastTapTime < DOUBLE_TAP_WINDOW) {
      clearTimeout(singleTapTimer);
      lastTapTime = 0;
      togglePlay();
    } else {
      lastTapTime = now;
      clearTimeout(singleTapTimer);
      singleTapTimer = setTimeout(() => { lastTapTime = 0; toggleControls(); }, DOUBLE_TAP_WINDOW);
    }
  }
}

let seekBadgeTimer;

/* ---------- Playback / progress bar / scrub preview ---------- */

function togglePlay() {
  if (video.paused) video.play(); else video.pause();
}

function setupPlaybackUI() {
  document.getElementById('playPauseBtn').addEventListener('click', togglePlay);
  document.getElementById('backBtn').addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
  document.getElementById('fwdBtn').addEventListener('click', () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); });
  document.getElementById('prevBtn').addEventListener('click', () => loadIndex(currentIndex - 1));
  document.getElementById('nextBtn').addEventListener('click', () => loadIndex(currentIndex + 1));

  video.addEventListener('play', () => {
    viewer.classList.remove('paused');
    document.getElementById('playIconBtn').innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  });
  video.addEventListener('pause', () => {
    viewer.classList.add('paused');
    document.getElementById('playIconBtn').innerHTML = '<path d="M8 5v14l11-7z"/>';
  });

  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const progressThumb = document.getElementById('progressThumb');
  const scrubPreview = document.getElementById('scrubPreview');
  const scrubTime = document.getElementById('scrubTime');
  const scrubThumb = document.getElementById('scrubThumb');
  const scrubCtx = scrubThumb.getContext('2d');
  let scrubbing = false;

  const previewVideo = document.createElement('video');
  previewVideo.muted = true;
  previewVideo.playsInline = true;
  previewVideo.preload = 'auto';
  let previewSeeking = false;
  let pendingPreviewTime = null;
  let previewTimeoutId = null;

  function drawPreviewFrame() {
    try { scrubCtx.drawImage(previewVideo, 0, 0, scrubThumb.width, scrubThumb.height); } catch (e) {}
  }
  function resolvePreviewSeek() {
    clearTimeout(previewTimeoutId);
    previewSeeking = false;
    drawPreviewFrame();
    if (pendingPreviewTime !== null) {
      const t = pendingPreviewTime;
      pendingPreviewTime = null;
      requestPreviewFrame(t);
    }
  }
  function requestPreviewFrame(time) {
    if (!previewVideo.src || !isFinite(previewVideo.duration)) { pendingPreviewTime = time; return; }
    time = Math.max(0, Math.min(previewVideo.duration, time));
    if (previewSeeking) { pendingPreviewTime = time; return; }
    if (Math.abs(previewVideo.currentTime - time) < 0.1) { drawPreviewFrame(); return; }
    previewSeeking = true;
    previewVideo.currentTime = time;
    clearTimeout(previewTimeoutId);
    previewTimeoutId = setTimeout(resolvePreviewSeek, 400);
  }
  previewVideo.addEventListener('seeked', resolvePreviewSeek);
  previewVideo.addEventListener('loadedmetadata', () => {
    if (pendingPreviewTime !== null) {
      const t = pendingPreviewTime;
      pendingPreviewTime = null;
      requestPreviewFrame(t);
    }
  });

  function formatTime(t) {
    if (!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  video.addEventListener('timeupdate', () => {
    if (video.duration && !scrubbing) {
      const pct = (video.currentTime / video.duration) * 100;
      progressFill.style.width = pct + '%';
      progressThumb.style.left = pct + '%';
    }
  });

  function updateFromEvent(e) {
    const rect = progressBar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    progressFill.style.width = (pct * 100) + '%';
    progressThumb.style.left = (pct * 100) + '%';
    const targetTime = pct * (video.duration || 0);
    if (video.duration) video.currentTime = targetTime;
    scrubPreview.style.left = (pct * 100) + '%';
    scrubTime.textContent = formatTime(targetTime);
    requestPreviewFrame(targetTime);
  }

  progressBar.addEventListener('pointerdown', (e) => {
    scrubbing = true;
    progressBar.classList.add('dragging');
    scrubPreview.classList.add('show');
    if (previewVideo.src !== video.src) {
      clearTimeout(previewTimeoutId);
      previewSeeking = false;
      pendingPreviewTime = null;
      previewVideo.src = video.src;
    }
    updateFromEvent(e);
  });
  window.addEventListener('pointermove', (e) => { if (scrubbing) updateFromEvent(e); });
  window.addEventListener('pointerup', () => {
    if (scrubbing) {
      scrubbing = false;
      progressBar.classList.remove('dragging');
      scrubPreview.classList.remove('show');
    }
  });
}

/* ---------- Top nav: fullscreen / mute ---------- */

function setupTopNav() {
  document.getElementById('fsToggle').addEventListener('click', async () => {
    if (!document.fullscreenElement) {
      try { await viewer.requestFullscreen(); } catch (err) {}
    } else {
      document.exitFullscreen();
    }
  });
  document.getElementById('muteToggle').addEventListener('click', () => {
    isMuted = !isMuted;
    video.muted = isMuted;
    document.getElementById('muteToggle').textContent = isMuted ? '🔇' : '🔊';
  });
}

/* ---------- Playlist ---------- */

function loadIndex(idx) {
  if (idx < 0 || idx >= files.length) return;
  currentIndex = idx;
  const file = files[idx];
  video.src = URL.createObjectURL(file);
  video.muted = isMuted;
  video.play().catch(() => {});
  document.getElementById('videoTitle').textContent = file.name.replace(/\.[^/.]+$/, '');
  document.getElementById('counter').textContent = (idx + 1) + ' / ' + files.length;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === files.length - 1;
  videoScale = 1;
  panX = 0; panY = 0;
  applyVideoTransform();
}

/* ---------- PWA plumbing ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); });
</script>
